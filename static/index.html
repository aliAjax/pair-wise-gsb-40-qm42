<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>海上搜救协调</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1100px;margin:30px auto;padding:0 20px;color:#17324d}table{border-collapse:collapse;width:100%;margin:16px 0}th,td{border:1px solid #cbd8e3;padding:8px;text-align:left}th{background:#edf5fb}code{background:#f2f5f7;padding:2px 5px}.card{background:#f7fbfe;border-left:5px solid #2784c7;padding:12px 16px}.review{color:#b3541e;font-weight:600}</style>
<h1>海上搜救协调</h1><div class="card">页面读取实时状态。业务写入通过 README 中的 JSON API 完成，并需要 <code>X-User</code>、<code>X-Role</code>。派单表与时间线使用同一派单编号，待复核原因保持一致。</div>
<h2>遇险事件</h2><table id="incidents"><thead><tr><th>编号</th><th>船名</th><th>状态</th><th>海况</th><th>负责机构</th><th>版本</th></tr></thead><tbody></tbody></table>
<h2>资源</h2><table id="assets"><thead><tr><th>名称</th><th>类型</th><th>状态</th><th>航程</th></tr></thead><tbody></tbody></table>
<h2>搜索区域</h2><table id="areas"><thead><tr><th>编号</th><th>事件</th><th>状态</th><th>优先级</th><th>资源</th></tr></thead><tbody></tbody></table>
<h2>派单</h2><table id="assignments"><thead><tr><th>编号</th><th>事件</th><th>区域</th><th>资源</th><th>状态</th><th>待核/失效原因</th></tr></thead><tbody></tbody></table>
<h2>改派草稿</h2><table id="drafts"><thead><tr><th>ID</th><th>动作</th><th>区域</th><th>资源</th><th>状态</th><th>版本冲突</th></tr></thead><tbody></tbody></table>
<h2>离线字段冲突</h2><table id="conflicts"><thead><tr><th>事件编号</th><th>字段</th><th>已存值</th><th>离线值</th><th>批次</th></tr></thead><tbody></tbody></table>
<h2>时间线</h2><ol id="timeline"></ol>
<script>
async function load(){
  const d=await fetch('/api/state').then(r=>r.json());
  const fill=(id,rows,cols)=>{document.querySelector('#'+id+' tbody').innerHTML=rows.map(r=>'<tr>'+cols.map(c=>`<td>${r[c]??''}</td>`).join('')+'</tr>').join('')};
  fill('incidents',d.incidents,['code','vessel_name','status','sea_state','lead_org','version']);
  fill('assets',d.assets,['name','kind','status','range_km']);
  fill('areas',d.search_areas,['code','incident_id','status','priority','assigned_asset_id']);
  document.querySelector('#assignments tbody').innerHTML=d.assignments.map(a=>{
    const reasons=JSON.parse(a.review_reasons||'[]');
    const why=[...(a.review_pending?reasons:[]),a.invalid_reason||''].filter(Boolean).join('；');
    const status=a.review_pending?`<span class="review">${a.status}（待复核）</span>`:a.status;
    return `<tr><td>${a.code}</td><td>${a.incident_id}</td><td>${a.area_id}</td><td>${a.asset_id}</td><td>${status}</td><td>${why}</td></tr>`;
  }).join('');
  document.querySelector('#drafts tbody').innerHTML=d.assignment_drafts.map(x=>{
    const c=JSON.parse(x.conflict||'{}');
    return `<tr><td>${x.id}</td><td>${x.action}</td><td>${x.area_id}</td><td>${x.asset_id}</td><td>${x.status}</td><td>${JSON.stringify(c.mismatched||{})}</td></tr>`;
  }).join('');
  document.querySelector('#conflicts tbody').innerHTML=d.clue_conflicts.map(x=>`<tr><td>${x.client_event_id}</td><td>${x.field}</td><td>${x.existing_value??''}</td><td>${x.incoming_value??''}</td><td>${x.batch_id}</td></tr>`).join('');
  document.querySelector('#timeline').innerHTML=d.timeline.slice(0,30).map(x=>`<li>${x.created_at} ${x.action} ${x.details}</li>`).join('');
}
load();
</script></html>
